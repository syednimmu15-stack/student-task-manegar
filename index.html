<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Report App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <p class="eyebrow">WEATHER REPORT</p>
      <h1>How's the weather?</h1>
      <p class="subtitle">Check current weather for any city.</p>
    </header>

    <form id="search-form" class="search">
      <label class="sr-only" for="city-input">City name</label>
      <input id="city-input" type="text" placeholder="Enter city (e.g. Hyderabad)" autocomplete="off" required>
      <button type="submit">Search</button>
    </form>

    <p id="message" class="message" role="status">Try searching for a city to get started.</p>

    <section id="weather-card" class="weather-card hidden" aria-live="polite">
      <div class="weather-top">
        <div>
          <p id="location" class="location">City, Country</p>
          <p id="description" class="description">Weather description</p>
        </div>
        <div id="weather-icon" class="weather-icon" aria-hidden="true">☀️</div>
      </div>
      <div class="temperature"><span id="temperature">--</span><span class="degree">°C</span></div>
      <div class="details">
        <div class="detail"><span class="detail-label">Feels like</span><strong><span id="feels-like">--</span>°C</strong></div>
        <div class="detail"><span class="detail-label">Humidity</span><strong><span id="humidity">--</span>%</strong></div>
        <div class="detail"><span class="detail-label">Wind speed</span><strong><span id="wind">--</span> km/h</strong></div>
      </div>
    </section>

    <footer>
      <p>Built with HTML, CSS &amp; JavaScript</p>
      <p class="note">Weather data provided by Open-Meteo. No API key required.</p>
    </footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
